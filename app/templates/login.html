<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Setu</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body class="auth-body">
  <main class="auth-shell">
    <section class="auth-panel">
      <div>
        <p class="eyebrow">Swarnagowri Foods &amp; Beverages</p>
        <h1>Setu Barcode Tally Bridge</h1>
        <p class="muted" style="margin-top:8px">Sign in to scan stock and sync with Tally.</p>
      </div>
      {% if error %}
      <div class="alert error">{{ error }}</div>
      {% endif %}
      <form method="post" action="/login" class="stack">
        <label>Username<input name="username" autocomplete="username" required autofocus></label>
        <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
        <button class="button primary full" type="submit">Login</button>
      </form>
    </section>
  </main>
</body>
</html>
