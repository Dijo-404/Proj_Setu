{% extends "base.html" %}
{% block title %}Settings · Setu{% endblock %}
{% block content %}
<section class="page-head">
  <div>
    <p class="eyebrow">System</p>
    <h1>Settings</h1>
  </div>
</section>

{% if error %}<div class="alert error">{{ error }}</div>{% endif %}

<section class="panel narrow">
  <form method="post" action="/settings" class="stack">
    <label>Company name<input name="company_name" value="{{ settings.company_name }}" required></label>
    <label class="checkline">
      <input type="checkbox" name="tally_enabled" value="true" {{ 'checked' if settings.tally_enabled == 'true' else '' }}>
      Enable Tally sync
    </label>
    <div class="two-col">
      <label>Tally host<input name="tally_host" value="{{ settings.tally_host }}" required></label>
      <label>Tally port<input name="tally_port" value="{{ settings.tally_port }}" required></label>
    </div>
    <div class="two-col">
      <label>Sales voucher<input name="sales_voucher_type" value="{{ settings.sales_voucher_type }}" required></label>
      <label>Purchase voucher<input name="purchase_voucher_type" value="{{ settings.purchase_voucher_type }}" required></label>
    </div>
    <label>Sales ledger<input name="sales_ledger_name" value="{{ settings.sales_ledger_name }}" required></label>
    <label>Purchase ledger<input name="purchase_ledger_name" value="{{ settings.purchase_ledger_name }}" required></label>
    <label>CGST ledger<input name="cgst_ledger_name" value="{{ settings.cgst_ledger_name }}" required></label>
    <label>SGST ledger<input name="sgst_ledger_name" value="{{ settings.sgst_ledger_name }}" required></label>
    <label>Round off ledger<input name="round_off_ledger_name" value="{{ settings.round_off_ledger_name }}" required></label>
    <label>Default party<input name="default_party_name" value="{{ settings.default_party_name }}" required></label>
    <label>Retry interval seconds<input name="retry_interval_seconds" type="number" min="30" step="1" value="{{ settings.retry_interval_seconds }}" required></label>
    <button class="button primary full" type="submit">Save settings</button>
  </form>
</section>
{% endblock %}
