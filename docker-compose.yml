# Setu QR Tally Bridge — single Windows LAN server deployment.
# SINGLE app replica only: SQLite is single-writer. Do NOT scale `app`
# (no `deploy: replicas`, no second container) against the shared SQLite
# volume. Horizontal scaling would require PostgreSQL (out of scope).

services:
  app:
    build: .
    # Loads APP_SECRET_KEY, BOOTSTRAP_ADMIN_*, DATABASE_URL, etc.
    # Copy .env.example -> .env and set a strong APP_SECRET_KEY first.
    env_file: .env
    environment:
      # Traffic reaches the app over Caddy HTTPS, so the session cookie
      # must be marked Secure. This overrides whatever is in .env.
      SESSION_COOKIE_SECURE: "true"
    volumes:
      # SQLite DB + WAL/SHM sidecars persist here (/app/data/setu.db).
      - setu-data:/app/data
    # Reachable as `app:8000` on the compose network (used by Caddy).
    expose:
      - "8000"
    # Loopback-only direct access for debugging without going through Caddy.
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Copy deployment/caddy/Caddyfile.example -> deployment/caddy/Caddyfile
      # and set `reverse_proxy app:8000` before starting.
      - ./deployment/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  setu-data:
  caddy-data:
  caddy-config:
